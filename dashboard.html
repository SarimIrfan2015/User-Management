<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="nav-title">User Management System</div>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </nav>

    <div class="dashboard">

        <div class="welcome-card">
            <h2>Dashboard</h2>
            <p id="welcomeText">Welcome!</p>
        </div>

        <div class="form-card">
            <h2 id="formTitle">Add User Information</h2>

            <form id="userForm">

                <div class="form-grid">

                    <div>
                        <label>Full Name</label>
                        <input type="text" id="fullName" required>
                    </div>

                    <div>
                        <label>Email</label>
                        <input type="email" id="userEmail" required>
                    </div>

                    <div>
                        <label>Age</label>
                        <input type="number" id="age" required>
                    </div>

                    <div>
                        <label>City</label>
                        <input type="text" id="city" required>
                    </div>

                    <div>
                        <label>Profession</label>
                        <input type="text" id="profession" required>
                    </div>

                </div>

                <div class="form-buttons">
                    <button type="submit" id="saveBtn">Add User</button>
                    <button type="button" id="cancelBtn" class="cancel-btn" style="display:none;">
                        Cancel
                    </button>
                </div>

            </form>
        </div>

        <div class="table-card">
            <div class="table-header">
                <h2>All Users</h2>
                <span id="userCount">0 Users</span>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Age</th>
                            <th>City</th>
                            <th>Profession</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="usersTable">
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/dashboard.js"></script>

</body>

</html>
